services:
  - type: web
    name: thenet
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: pip install .
    startCommand: python -m thenet
    envVars:
      - key: THENET_POSTGRES_DSN
        fromDatabase:
          name: thenet-db
          property: connectionString
