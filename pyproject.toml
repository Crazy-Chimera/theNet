[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thenet"
version = "3.0.0"
description = "Relational network architecture for collective computation"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46,<47",
    "websockets>=16,<17",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
thenet = "thenet.cli:main"

[tool.setuptools]
packages = ["src", "thenet"]
