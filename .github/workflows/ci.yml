name: theNet CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest build
      - name: Build package
        run: python -m build
      - name: Run tests
        # Keep the repository root importable for the primitive modules.
        # The suite is the executable specification for every completed layer.
        env:
          PYTHONPATH: .
        run: python -m pytest -q
