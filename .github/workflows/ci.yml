name: theNet CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thenet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thenet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THENET_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/thenet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Smoke test live Render MVP
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://thenet-eew6.onrender.com/health
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://thenet-eew6.onrender.com/ | grep -q "theNet MVP 0.1"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            -X POST https://thenet-eew6.onrender.com/v1/closure \
            -H "Content-Type: application/json" \
            -d '{"source_subject":"CI Agent Ω","target_subject":"theNet","relation_kind":"verifies","proposal_text":"CI closure","evidence":"live Render smoke test","expression_id":"ci-expression","created_at":"2026-09-30T00:00:00Z"}' \
            | grep -q '"agent_state"'
