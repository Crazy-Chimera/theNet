name: theNet CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thenet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thenet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THENET_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/thenet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
